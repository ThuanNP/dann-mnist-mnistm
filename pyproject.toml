[project]
name = "dann-mnist-mnistm"
version = "0.1.0"
description = "Tái lập thí nghiệm MNIST -> MNIST-M: baseline CNN so với DANN (Ganin & Lempitsky, 2015)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pillow>=10",
    "huggingface-hub>=0.23",
    "streamlit>=1.35",
]

[dependency-groups]
dev = ["pytest>=8"]

# Trên Windows, torch từ PyPI chỉ có bản CPU; lấy bản CUDA 13.0 từ chỉ mục PyTorch.
# Linux (Colab) và macOS vẫn cài từ PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
